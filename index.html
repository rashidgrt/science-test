const $=id=>document.getElementById(id);
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=Object.keys(D);
let total=0,two=0;cls.forEach(k=>{total+=D[k].t.length;two+=D[k].t.filter(x=>x[7]>1).length});
$('sum').innerHTML=[[cls.length,'Classes'],[total,'Total tests'],[6,'Months each'],[two,'Two-page tests']].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('');
$('cards').innerHTML=cls.map(k=>{const t=D[k].t,c=ty=>t.filter(x=>x[4]===ty).length,u=Math.max(...t.map(x=>x[3]));
 return `<div class="cls"><div class="n">Science – Class ${k}</div><div class="m">${t.length} tests · 6 months · Units 1–${u}</div>
 <div class="tags"><span class="tag">${c('Daily')} daily</span><span class="tag">${c('Exercise')} exercise</span><span class="tag">${c('Weekly Revision')} weekly revision</span><span class="tag">${c('Monthly Test')} monthly</span></div>
 <a class="btn" href="${D[k].url}">Open Class ${k} tests →</a></div>`}).join('');
$('fc').innerHTML+=cls.map(k=>`<option value="${k}">Class ${k}</option>`).join('');
function run(){
 const q=$('q').value.trim().toLowerCase(),c=$('fc').value,ty=$('ft').value;
 if(!q&&!c&&!ty){$('res').innerHTML='';$('cnt').textContent='Type a topic or choose a class / test type to list matching tests.';return}
 const out=[];cls.forEach(k=>{if(c&&c!==k)return;D[k].t.forEach(x=>{if((!ty||x[4]===ty)&&(!q||x[6].toLowerCase().includes(q)))out.push([k,x])})});
 $('cnt').textContent=out.length+' matching tests'+(out.length>80?' (showing first 80)':'')+' – tap one to open its class page.';
 $('res').innerHTML=out.slice(0,80).map(([k,x])=>`<a class="row" href="${D[k].url}"><div class="w">Class ${k} · Month ${x[0]} · ${ord(x[1])} Week · ${ord(x[2])} Day · Unit ${x[3]} · ${x[4]} · ${x[5]} marks</div><div class="t">${esc(x[6])}</div></a>`).join('');
}
['q','fc','ft'].forEach(i=>$(i).addEventListener('input',run));run();
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
</script></body></html>
